# Original idea by @ISnackable. Many thanks to him for handling the most hardest parts!
# https://github.com/ISnackable/CercubePlus/blob/main/.github/workflows/Build.yml

name: Build and Release YTLitePlus

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "iOS SDK Version"
        default: "17.5"
        required: true
        type: string
      decrypted_youtube_url:
        description: "Direct URL of the decrypted YouTube ipa"
        default: ""
        required: true
        type: string
      bundle_id:
        description: "Modify the bundle ID"
        default: "com.google.ios.youtube"
        required: true
        type: string
      app_name:
        description: "Modify the app name"
        default: "YouTube"
        required: true
        type: string
      commit_id:
        description: "(Optional) Commit ID to build at"
        default: ""
        required: false
        type: string
      upload_artifact:
        description: "Upload iPA as artifact (Public)"
        default: true
        required: false
        type: boolean
      catbox_upload:
        description: "Upload iPA to Catbox.moe (URL)"
        default: false
        required: false
        type: boolean
      create_release:
        description: "Create a draft release (Private)"
        default: false
        required: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build YTLitePlus
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          path: main
          ref: ${{ github.event.inputs.commit_id || github.ref }}
          submodules: recursive

      - name: Install Dependencies
        run: brew install ldid dpkg make meson

      - name: Download Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive

      - name: iOS SDK Caching
        id: SDK
        uses: actions/cache@v4
        env:
          cache-name: iOS-${{ inputs.sdk_version }}-SDK
        with:
          path: theos/sdks/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Download iOS SDK
        if: steps.SDK.outputs.cache-hit != 'true'
        run: |
          # Only download the specific SDK version
          git clone -n --depth=1 --filter=tree:0 https://github.com/aricloverALT/sdks/
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS${{ inputs.sdk_version }}.sdk
          git checkout
          mv *.sdk $THEOS/sdks
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Download Theos Jailed
        uses: actions/checkout@v4
        with:
          repository: qnblackcat/theos-jailed
          ref: master
          path: theos-jailed
          submodules: recursive

      - name: Install Theos Jailed
        run: |
          ./theos-jailed/install
        env:
          THEOS: ${{ github.workspace }}/theos
        
      - name: Fix Compiling
        run: |
          # Update GNU Make to allow for faster building
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          (echo export PATH="/usr/local/opt/make/libexec/gnubin:$PATH" >> ~/.bash_profile)
          source ~/.bash_profile

      - name: Hash YT ipa url
        run: |
          URL_YT="$(jq -r '.inputs.decrypted_youtube_url' $GITHUB_EVENT_PATH)"
          echo ::add-mask::$URL_YT
          echo URL_YT=$URL_YT >> $GITHUB_ENV

      - name: Resolve latest YTPlus release
        run: |
          release=$(curl --fail-with-body --location --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/dayanch96/YTLite/releases?per_page=100' \
            | jq -cer 'map(select(.draft == false)) | first')
          tag=$(jq -er '.tag_name' <<< "$release")
          asset=$(jq -cer '.assets[] | select(.name | endswith("_iphoneos-arm64.deb"))' <<< "$release")
          tag_version=${tag#v}
          deb_name=$(jq -er '.name' <<< "$asset")
          deb_version=${deb_name#com.dvntm.ytlite_}
          deb_version=${deb_version%_iphoneos-arm64.deb}
          deb_url=$(jq -er '.browser_download_url' <<< "$asset")
          echo "YTLITE_VERSION=$tag_version" >> "$GITHUB_ENV"
          echo "YTLITE_DEB_VERSION=$deb_version" >> "$GITHUB_ENV"
          echo "YTLITE_DEB_URL=$deb_url" >> "$GITHUB_ENV"
          echo "Using YTPlus $tag ($deb_name)"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Prepare YouTube iPA
        run: |
          # Download and unzip iPA
          curl --fail --location --silent --show-error \
            --output main/YouTube.ipa \
            --write-out 'HTTP %{http_code}; type %{content_type}; bytes %{size_download}\n' \
            "$YOUTUBE_URL"
          unzip -q main/YouTube.ipa -d main/tmp
          # Get the version number of the YouTube app and store it
          echo "YT_VERSION=$(grep -A 1 '<key>CFBundleVersion</key>' main/tmp/Payload/YouTube.app/Info.plist | grep '<string>' | awk -F'[><]' '{print $3}')" >> $GITHUB_ENV
          # Remove contents in the iPA that interfere with sideloading
          rm -rf main/tmp/Payload/YouTube.app/_CodeSignature/CodeResources
          rm -rf main/tmp/Payload/YouTube.app/PlugIns/*
          # Newer YouTube IPAs store Apple's migration extension separately from PlugIns.
          # It keeps the stock bundle ID and fails iLoader's extension-prefix validation.
          rm -rf main/tmp/Payload/YouTube.app/Extensions
          # Modify Info.plist to remove UISupportedDevices (Python script)
          python - <<EOF
          import plistlib
          def remove_uisupporteddevices(filepath):
              with open(filepath, 'rb') as f:
                  plist = plistlib.load(f)

              if 'UISupportedDevices' in plist:
                  del plist['UISupportedDevices']

              with open(filepath, 'wb') as f:
                  plistlib.dump(plist, f)

          filepath = 'main/tmp/Payload/YouTube.app/Info.plist'
          remove_uisupporteddevices(filepath)
          EOF
          # Manually install the Open in YouTube extension
          cp -R main/Extensions/*.appex main/tmp/Payload/YouTube.app/PlugIns
        env:
          THEOS: ${{ github.workspace }}/theos
          YOUTUBE_URL: ${{ env.URL_YT }}

      - name: Download and unpack selected YTPlus package
        run: |
          mkdir -p main/Tweaks/YTLite
          package="main/Tweaks/YTLite/com.dvntm.ytlite_${YTLITE_DEB_VERSION}_iphoneos-arm64.deb"
          curl --fail --location --silent --show-error --output "$package" "$YTLITE_DEB_URL"
          test -s "$package"
          dpkg-deb --extract "$package" main/Tweaks/YTLite
          test -s "main/Tweaks/YTLite/var/jb/Library/MobileSubstrate/DynamicLibraries/YTLite.dylib"
          test -d "main/Tweaks/YTLite/var/jb/Library/Application Support/YTLite.bundle"
          echo "Downloaded and unpacked YTPlus $YTLITE_VERSION package: $(du -h "$package" | cut -f1)"

      - name: Apply current YTPlus translations
        run: |
          source_repo="$RUNNER_TEMP/YTLite-upstream"
          source_bundle="$source_repo/layout/Library/Application Support/YTLite.bundle"
          target_bundle="main/Tweaks/YTLite/var/jb/Library/Application Support/YTLite.bundle"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/dayanch96/YTLite.git "$source_repo"
          git -C "$source_repo" sparse-checkout set "layout/Library/Application Support/YTLite.bundle"
          test -d "$source_bundle"
          while IFS= read -r -d '' source; do
            relative="${source#"$source_bundle"/}"
            mkdir -p "$target_bundle/$(dirname "$relative")"
            cp "$source" "$target_bundle/$relative"
          done < <(find "$source_bundle" -type f -name Localizable.strings -print0)
          echo "YTLITE_SOURCE_COMMIT=$(git -C "$source_repo" rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Applied current YTPlus translations from $(git -C "$source_repo" rev-parse --short HEAD)"

      - name: Prepare YTUHD dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path

          makefile = Path("main/Tweaks/YTUHD/Makefile")
          content = makefile.read_text()
          old = "$(THEOS_PROJECT_DIR)/vendor/"
          new = "$(THEOS_PROJECT_DIR)/Tweaks/YTUHD/vendor/"
          if old not in content:
              raise SystemExit(f"Expected vendor paths not found in {makefile}")
          makefile.write_text(content.replace(old, new))
          PY
          main/Tweaks/YTUHD/vendor/build_libvpx.sh
          main/Tweaks/YTUHD/vendor/build_dav1d.sh

      - name: Build Package
        id: build_package
        run: |
          cd ${{ github.workspace }}/main
          # Replace lines in Makefile based on inputs
          sed -i '' "s/^BUNDLE_ID.*$/BUNDLE_ID = ${{ env.BUNDLE_ID }}/" Makefile
          sed -i '' "s/^DISPLAY_NAME.*$/DISPLAY_NAME = ${{ env.APP_NAME }}/" Makefile
          sed -i '' "s/^PACKAGE_VERSION.*$/PACKAGE_VERSION = ${{ env.YT_VERSION }}-${{ env.YTLITE_VERSION }}/" Makefile
          sed -i '' "s/^export TARGET.*$/export TARGET = iphone:clang:${{ inputs.sdk_version }}:14.0/" Makefile
          # Build the package
          make package SIDELOAD=1 YTLITE_VERSION="${{ env.YTLITE_DEB_VERSION }}"
          # Rename the package based on the version
          (mv "packages/$(ls -t packages | head -n1)" "packages/YTLitePlus_${{ env.YT_VERSION }}_${{ env.YTLITE_VERSION }}.ipa")
          # Pass package name to the upload step
          echo "package=$(ls -t packages | head -n1)" >> $GITHUB_OUTPUT
          # Print out the hash and bundle ID
          echo -e "==> \033[1mSHASUM256: $(shasum -a 256 packages/*.ipa | cut -f1 -d' ')\033[0m"
          echo -e "==> \033[1mBundle ID: ${{ env.BUNDLE_ID }}\033[0m"
        env:
          THEOS: ${{ github.workspace }}/theos
          BUNDLE_ID: ${{ inputs.bundle_id }}
          APP_NAME: ${{ inputs.app_name }}

      - name: Bundle Alderis for jailed install
        run: |
          ipa="${{ github.workspace }}/main/packages/${{ steps.build_package.outputs.package }}"
          framework="$(find main/.theos -type d -name Alderis.framework -print -quit)"
          if [ -z "$framework" ]; then
            echo "Alderis.framework was not produced by the Alderis build" >&2
            find main/.theos -iname '*alderis*' -print >&2 | head -100
            exit 1
          fi

          work="$(mktemp -d)"
          unzip -q "$ipa" -d "$work"
          app="$work/Payload/YouTube.app"
          mkdir -p "$app/Frameworks"
          rm -rf "$app/Frameworks/Alderis.framework"
          cp -R "$framework" "$app/Frameworks/Alderis.framework"
          rm -rf "$app/Frameworks/Alderis.framework/_CodeSignature"

          # Alderis currently links with its jailbreak filesystem install path.
          # Rewrite both the dependency and framework ID for a sideloaded app.
          install_name_tool -id '@rpath/Alderis.framework/Alderis' \
            "$app/Frameworks/Alderis.framework/Alderis"
          old_path='/Library/Frameworks/Alderis.framework/Alderis'
          new_path='@rpath/Alderis.framework/Alderis'
          while IFS= read -r -d '' binary; do
            if file -b "$binary" | grep -q 'Mach-O'; then
              if otool -L "$binary" 2>/dev/null | grep -Fq "$old_path"; then
                install_name_tool -change "$old_path" "$new_path" "$binary"
              fi
            fi
          done < <(find "$app/Frameworks" -type f -print0)

          while IFS= read -r -d '' binary; do
            if file -b "$binary" | grep -q 'Mach-O'; then
              if otool -L "$binary" 2>/dev/null | grep -Fq "$old_path"; then
                echo "Unfixed Alderis install-name reference in $binary" >&2
                exit 1
              fi
            fi
          done < <(find "$app/Frameworks" -type f -print0)
          otool -L "$app/Frameworks/YTLitePlus.dylib" | grep -F "$new_path"
          otool -L "$app/Frameworks/libcolorpicker.dylib" | grep -F "$new_path"

          rm -f "$ipa"
          ditto -c -k --sequesterRsrc --keepParent "$work/Payload" "$ipa"
          rm -rf "$work"

      - name: Upload Artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: YTLitePlus_${{ env.YT_VERSION }}_${{ env.YTLITE_VERSION }}
          path: ${{ github.workspace }}/main/packages/${{ steps.build_package.outputs.package }}
          if-no-files-found: error
          
      - name: Upload Artifact to Catbox
        if: ${{ inputs.catbox_upload }}
        run: |
          RESPONSE=$(curl -F "reqtype=fileupload" -F "fileToUpload=@${{ github.workspace }}/main/packages/${{ steps.build_package.outputs.package }}" https://catbox.moe/user/api.php)
          CATBOX_URL=$(echo $RESPONSE | grep -o -E 'https://files.catbox.moe/[^"]*')
          echo "Uploaded artifact to $CATBOX_URL"
          CATBOX_FILE=$(echo $CATBOX_URL | sed 's|https://files.catbox.moe/||')
          # Pass Catbox URL to the release steps
          echo "CATBOX_FILE=$CATBOX_FILE" >> $GITHUB_ENV
          echo "CATBOX_URL=$CATBOX_URL" >> $GITHUB_ENV
      
      - name: Prepare Release Notes
        if: ${{ inputs.create_release }}
        run: |
          export TODAY=$(date '+%Y-%m-%d')
          sed "s/%ytliteplus_version%/${{ env.YTLITE_VERSION }}/g; s/%youtube_version%/${{ env.YT_VERSION }}/g; s/%catbox_url%/${{ env.CATBOX_FILE }}/g; s/%date%/$TODAY/g" \
          main/.github/RELEASE_TEMPLATE/Release.md > ${{ github.workspace }}/release_notes.md

      - name: Create Draft Release
        if: ${{ inputs.create_release }}
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.YT_VERSION }}-${{ env.YTLITE_VERSION }}
          name: v${{ env.YT_VERSION }}-${{ env.YTLITE_VERSION }} - YTLitePlus
          files: main/packages/*.ipa
          draft: true
          body_path: ${{ github.workspace }}/release_notes.md

      - name: Update Altstore Source with latest release
        if: ${{ inputs.create_release }}
        run: |
          curl --location --request POST 'https://api.github.com/repos/Balackburn/YTLitePlusAltstore/dispatches' \
          --header 'Authorization: token ${{ secrets.PERSONAL_ACCESS_TOKEN }}' \
          --header 'Content-Type: application/json' \
          --data-raw '{
            "event_type": "update-altstore-source-trigger"
          }'

      - name: Job Summary
        run: |
          echo -e '### 📺 Build Complete' >> $GITHUB_STEP_SUMMARY

      - name: Job Summary - Artifact Upload
        if: ${{ inputs.upload_artifact }}
        run: |
          echo -e '### 📦 Artifact Upload\n\nThe artifact was uploaded successfully! Refresh and [scroll down](#artifacts) to view the artifact. Note that you must be signed in to GitHub to download it.' >> $GITHUB_STEP_SUMMARY

      - name: Job Summary - Catbox Upload
        if: ${{ inputs.catbox_upload}}
        run: |
          echo -e '### 🐱 Catbox Upload\n\nThe Catbox upload was successful! Here is a permanent shareable link: '$CATBOX_URL >> $GITHUB_STEP_SUMMARY

      - name: Job Summary - Draft Release
        if: ${{ inputs.create_release }}
        run: |
          REPO_URL="https://github.com/${{ github.repository }}"
          RELEASES_URL="$REPO_URL/releases"
          echo -e '### 🚀 Draft Release\n\nThe release draft has been created successfully! You can view your releases here: '$RELEASES_URL >> $GITHUB_STEP_SUMMARY

      - name: Job Summary - Link to remove GitHub Action runs
        run: |
          REPO_URL="https://github.com/${{ github.repository }}"
          DELETE_RUNS_URL="$REPO_URL/actions/workflows/delete-workflow-runs.yml"
          echo -e '### 🧹 Cleanup\n\nYou can remove previous GitHub Action runs here: '$DELETE_RUNS_URL >> $GITHUB_STEP_SUMMARY
